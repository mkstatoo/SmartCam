name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core detection tests (pure Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart run tool/run_core_tests.dart

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding
        run: |
          flutter create . --org ir.detective --project-name detective_camera --platforms android
          rm -rf test   # تست پیش‌فرض flutter create به این پروژه مربوط نیست
          git checkout -- lib pubspec.yaml 2>/dev/null || true
          python3 tool/patch_android.py .

      - run: flutter pub get

      - name: Analyze (informational)
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || true
          # خطاها به‌صورت annotation هم ثبت می‌شوند تا بدون دانلود لاگ قابل خواندن باشند
          grep -E "^\s*error " analyze.log | head -10 | cut -c1-350 | while IFS= read -r l; do echo "::warning::analyze: $l"; done

      - name: Build APK
        run: |
          set +e
          flutter build apk --release 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            sed -n '/What went wrong/,/\* Try/p' build.log | head -10 | cut -c1-380 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: detective-camera-apk
          path: build/app/outputs/flutter-apk/app-release.apk
