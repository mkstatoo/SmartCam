name: build-and-test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # فقط برای ساخت Release هنگام push تگ v*

jobs:
  core-tests:
    name: Core detection tests (pure Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart run tool/run_core_tests.dart

  android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    needs: core-tests
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding
        run: |
          flutter create . --org ir.detective --project-name detective_camera --platforms android
          rm -rf test   # تست پیش‌فرض flutter create به این پروژه مربوط نیست
          git checkout -- lib pubspec.yaml 2>/dev/null || true
          python3 tool/patch_android.py .

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Prepare signing key
        run: |
          mkdir -p dist
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "$PWD/android/upload-keystore.jks" \
              > android/key.properties
            echo "SIGNING=release" >> "$GITHUB_ENV"
            echo "::notice::Signing with the REAL release key from repository secrets"
          else
            keytool -genkeypair -keystore android/test-keystore.jks -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 30 -alias testkey \
              -storepass testpass123 -keypass testpass123 \
              -dname "CN=UNOFFICIAL TEST KEY, O=Detective Camera CI" 2>/dev/null
            printf 'storePassword=testpass123\nkeyPassword=testpass123\nkeyAlias=testkey\nstoreFile=%s\n' \
              "$PWD/android/test-keystore.jks" > android/key.properties
            echo "SIGNING=test" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set: signing with a THROWAWAY test key. Do not publish these files."
          fi

      - name: Analyze (informational)
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || true
          grep -E "^\s*error " analyze.log | head -10 | cut -c1-350 | while IFS= read -r l; do echo "::warning::analyze: $l"; done

      - name: Build universal APK
        run: |
          chmod +x tool/ci_build.sh
          tool/ci_build.sh apk build apk --release --build-number="$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk dist/detective-camera-universal.apk

      - name: Build per-ABI APKs
        run: |
          tool/ci_build.sh split build apk --release --split-per-abi --build-number="$GITHUB_RUN_NUMBER"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "dist/detective-camera-${abi}.apk"
          done

      - name: Build App Bundle (AAB)
        run: |
          tool/ci_build.sh aab build appbundle --release --build-number="$GITHUB_RUN_NUMBER"
          cp build/app/outputs/bundle/release/app-release.aab dist/detective-camera.aab

      - name: Verify outputs (signature, size, 16KB alignment)
        run: python3 tool/check_apk.py dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: detective-camera-${{ env.SIGNING }}-signed
          path: dist/*

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ env.SIGNING != 'release' }}
          generate_release_notes: true
